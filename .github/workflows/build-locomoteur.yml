name: Construire les PDF UE B1 système locomoteur
on:
  push:
    branches: [main]
    paths:
      - 'cours/UE_B1_Systeme_locomoteur_CM_2026.json'
      - 'scripts/render-locomoteur.py'
      - '.github/workflows/build-locomoteur.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer ReportLab
        run: python -m pip install reportlab pypdf
      - name: Générer et contrôler les deux PDF
        run: |
          python scripts/render-locomoteur.py
          python - <<'PY'
          from pypdf import PdfReader
          from pathlib import Path
          for n,minimum in [('16Hi2fS_oW_u5yV_KG1dcYtZxiE9wjWEW.pdf',5),('1lWOT6PeQwnjPPmqc3-rsSzLMXIQZUmzF.pdf',20)]:
              p=Path('documents')/n
              r=PdfReader(str(p))
              assert len(r.pages)>=minimum
              assert p.stat().st_size>15000
              assert all((z.extract_text() or '').strip() for z in r.pages)
              print(n,len(r.pages),p.stat().st_size)
          PY
      - name: Remplacer les anciens PDF et publier sur main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add documents/16Hi2fS_oW_u5yV_KG1dcYtZxiE9wjWEW.pdf documents/1lWOT6PeQwnjPPmqc3-rsSzLMXIQZUmzF.pdf
          if ! git diff --cached --quiet; then
            git commit -m 'Remplacer les supports provisoires UE B1 par les PDF finaux A4/A5'
            git push
          fi

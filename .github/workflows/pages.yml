name: Publish IFSI binder
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '13 6 3 * *' # Mise à jour mensuelle de l'index BDPM
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier le classeur avant publication
        run: python3 scripts/validate_site.py
      - name: Contrôler le rafraîchissement automatique
        run: |
          node --check site-sync.js
          python3 -m py_compile scripts/prepare_public_site.py
      - name: Vérifier le marquage des prescriptions infirmières
        run: |
          node --check medicaments-prescription.js
          node --check medicaments-recherche.js
          node scripts/test_medication_prescription.js
      - name: Actualiser l'index officiel des médicaments (BDPM)
        run: python3 scripts/build_bdpm_index.py
      - name: Préparer le site partagé et son identifiant de publication
        run: python3 scripts/prepare_public_site.py
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
